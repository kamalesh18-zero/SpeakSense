[project]
name = "speaksense-ai-backend"
version = "0.1.0"
description = "SpeakSense AI: Contrastive Speech Analytics and Temporal Flaw Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "imageio-ffmpeg>=0.5.1",
    "librosa>=0.10.2",
    "scikit-learn>=1.5.0",
    "faster-whisper>=1.0.3",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
